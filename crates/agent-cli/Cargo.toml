[package]
name = "hopilo-agent-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Read-only command line and MCP access to Hopilo sessions for coding agents"

[[bin]]
name = "hopilo-cli"
path = "src/main.rs"

[lib]
name = "hopilo_agent_cli"
path = "src/lib.rs"

[dependencies]
hopilo-core.workspace = true
hopilo-database.workspace = true
hopilo-native-host = { path = "../native-host" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
