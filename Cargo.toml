[workspace]
resolver = "2"
members = ["crates/core", "crates/adapters", "crates/pack-format", "crates/database", "crates/native-host", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
hopilo-core = { path = "crates/core" }
hopilo-adapters = { path = "crates/adapters" }
hopilo-pack-format = { path = "crates/pack-format" }
hopilo-database = { path = "crates/database" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
ulid = "1"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
zstd = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"

[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
debug = 0
