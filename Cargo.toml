[workspace]
resolver = "2"
members = ["crates/core", "crates/rich", "crates/adapters", "crates/pack-format", "crates/database", "crates/native-host", "crates/agent-cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.6"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
hopilo-core = { path = "crates/core" }
hopilo-adapters = { path = "crates/adapters" }
hopilo-pack-format = { path = "crates/pack-format" }
hopilo-database = { path = "crates/database" }
hopilo-rich = { path = "crates/rich" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
ulid = "1"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
zstd = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"

[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
debug = 0


[profile.dev.package.hopilo-rich]
opt-level = 3

[profile.dev.package.syntect]
opt-level = 3

[profile.dev.package.fancy-regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3

[profile.dev.package.bincode]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.pulldown-cmark]
opt-level = 3

[profile.dev.package.two-face]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.serde]
opt-level = 3

[profile.dev.package.serde_core]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.adler2]
opt-level = 3

[profile.dev.package.simd-adler32]
opt-level = 3

[profile.dev.package.memchr]
opt-level = 3

[profile.dev.package.aho-corasick]
opt-level = 3
